
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in</title>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );
        }

        /* Main Login Container */
        .login-container {
            width: 900px;
            min-height: 550px;

            display: flex;

            background: white;
            border-radius: 25px;

            overflow: hidden;

            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
        }

        /* Left Side */
        .welcome-section {
            width: 50%;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            padding: 50px;

            color: white;
            text-align: center;

            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );
        }

        .welcome-section i {
            font-size: 80px;
            margin-bottom: 25px;
        }

        .welcome-section h1 {
            font-size: 38px;
            margin-bottom: 15px;
        }

        .welcome-section p {
            font-size: 16px;
            line-height: 1.6;
            opacity: 0.9;
        }

        /* Right Side */
        .login-section {
            width: 50%;
            padding: 55px 50px;

            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .login-section h2 {
            font-size: 32px;
            color: #333;
            margin-bottom: 8px;
        }

        .login-section .subtitle {
            color: #777;
            margin-bottom: 30px;
        }

        /* Input */
        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #444;
            font-weight: bold;
        }

        .input-field {
            position: relative;
        }

        .input-field i {
            position: absolute;
            left: 15px;
            top: 50%;

            transform: translateY(-50%);

            color: #888;
        }

        .input-field input {
            width: 100%;
            padding: 14px 45px;

            border: 1px solid #ddd;
            border-radius: 10px;

            outline: none;
            font-size: 15px;

            transition: 0.3s;
        }

        .input-field input:focus {
            border-color: #667eea;
            box-shadow: 0 0 8px rgba(102, 126, 234, 0.2);
        }

        /* Show Password */
        .show-password {
            position: absolute;
            right: 15px;
            left:100%;
            top: 50%;

            transform: translateY(-50%);

            cursor: pointer;
            color: #888;
        }

        /* Remember / Forgot */
        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 25px;

            font-size: 14px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #555;
        }

        .options a {
            color: #667eea;
            text-decoration: none;
        }

        .options a:hover {
            text-decoration: underline;
        }

        /* Login Button */
        .login-btn {
            width: 100%;

            padding: 14px;

            border: none;
            border-radius: 10px;

            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );

            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        .login-btn:hover {
            transform: translateY(-2px);

            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;

            margin: 25px 0;

            color: #aaa;
            font-size: 14px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;

            height: 1px;
            background: #ddd;
        }

        .divider span {
            padding: 0 10px;
        }

        /* Social Buttons */
        .social-buttons {
            display: flex;
            gap: 10px;
        }

        .social-btn {
            flex: 1;

            padding: 11px;

            border: 1px solid #ddd;
            border-radius: 8px;

            background: white;

            cursor: pointer;

            transition: 0.3s;
        }

        .social-btn:hover {
            background: #f5f5f5;
            transform: translateY(-2px);
        }

        .social-btn i {
            margin-right: 7px;
        }

        /* Register */
        .register {
            text-align: center;

            margin-top: 25px;

            color: #777;
            font-size: 14px;
        }

        .register a {
            color: #667eea;
            font-weight: bold;
            text-decoration: none;
        }

        /* Mobile */
        @media (max-width: 750px) {

            .login-container {
                width: 90%;
            }

            .welcome-section {
                display: none;
            }

            .login-section {
                width: 100%;
                padding: 40px 30px;
            }
        }

    </style>

</head>

<body>

    <div class="login-container">

        <!-- Welcome Section -->
        <div class="welcome-section">

            <img src="img/staymate_logo-removebg-preview.png" alt="" srcset="">

            <h1>Welcome Back!</h1>

            <p>
                We're happy to see you again.
                Login to continue your journey
                and explore new experiences.
            </p>

        </div>


        <!-- Login Section -->
        <div class="login-section">

            <h2>Sign In</h2>

            <p class="subtitle">
                Enter your details to access your account
            </p>


            <form>

                <!-- Email -->
                <div class="input-group">

                    <label>Email Address</label>

                    <div class="input-field">

                        <i class="fa-solid fa-envelope"></i>

                        <input
                            type="email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>

                </div>


                <!-- Password -->
                <div class="input-group">

                    <label>Password</label>

                    <div class="input-field">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            required
                            
                        >
                         <i 
                            class="fa-solid fa-eye show-password"
                            onclick="showPassword()">
                        </i> 
                    </div>
                        
                </div>


                <!-- Options -->
                <div class="options">

                    <label class="remember">

                        <input type="checkbox">

                        Remember me

                    </label>

                    <a href="#">
                        Forgot Password?
                    </a>

                </div>


                <!-- Login -->
                <button
                    type="submit"
                    class="login-btn">

                    Login

                </button>


                <!-- Divider -->
                <div class="divider">

                    <span>OR</span>

                </div>


                <!-- Social Login -->
                <div class="social-buttons">

                    <button type="button" class="social-btn">

                        <i class="fa-brands fa-google"></i>

                        Google

                    </button>

                    <button type="button" class="social-btn">

                        <i class="fa-brands fa-facebook"></i>

                        Facebook

                    </button>

                </div>


                <!-- Register -->
                <div class="register">

                    Don't have an account?

                    <a href="register.html">
                    Create Account
                    </a>

                </div>

            </form>

        </div>

    </div>


    <script>

        function showPassword() {

            let password =
                document.getElementById("password");

            if (password.type === "password") {

                password.type = "text";

            } else {

                password.type = "password";

            }

        }

    </script>

</body>
</html>
