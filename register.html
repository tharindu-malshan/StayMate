
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - StayMate</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;

            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );
        }

        .register-container {
            width: 900px;
            max-width: 100%;
            min-height: 580px;

            display: flex;
            background: white;
            border-radius: 25px;
            overflow: hidden;

            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
        }

        /* Left Side */

        .welcome-section {
            width: 45%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            padding: 40px;
            color: white;
            text-align: center;

            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );
        }

        .welcome-section img {
            width: 180px;
            max-width: 100%;
            height: auto;
            margin-bottom: 25px;
        }

        .welcome-section h1 {
            font-size: 36px;
            margin-bottom: 15px;
        }

        .welcome-section p {
            line-height: 1.6;
            opacity: 0.9;
        }

        /* Right Side */

        .register-section {
            width: 55%;
            padding: 40px 50px;

            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .register-section h2 {
            font-size: 30px;
            color: #333;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 25px;
        }

        /* Input Groups */

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 7px;
            color: #444;
            font-weight: bold;
        }

        .input-field {
            position: relative;
        }

        .input-field i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
            pointer-events: none;
        }

        .input-field input,
        .input-field select {
            width: 100%;
            padding: 13px 15px 13px 45px;

            border: 1px solid #ddd;
            border-radius: 10px;
            outline: none;

            font-size: 15px;
            background-color: white;

            transition: 0.3s;
        }

        .input-field input:focus,
        .input-field select:focus {
            border-color: #667eea;
            box-shadow: 0 0 8px rgba(102, 126, 234, 0.2);
        }

        /* Dynamic Fields */

        #dynamic-fields {
            margin-top: 5px;
        }

        /* Register Button */

        .register-btn {
            width: 100%;
            padding: 14px;
            margin-top: 10px;

            border: none;
            border-radius: 10px;

            background: linear-gradient(
                135deg,
                #667eea,
                #764ba2
            );

            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;

            transition: 0.3s;
        }

        .register-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }

        /* Login Link */

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #777;
            font-size: 14px;
        }

        .login-link a {
            color: #667eea;
            font-weight: bold;
            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        /* Initially hide registration controls */

        .hidden {
            display: none;
        }

        /* Mobile */

        @media (max-width: 750px) {
            .register-container {
                width: 100%;
            }

            .welcome-section {
                display: none;
            }

            .register-section {
                width: 100%;
                padding: 35px 25px;
            }
        }
    </style>
</head>

<body>

    <div class="register-container">

        <!-- Welcome Section -->

        <div class="welcome-section">

            <img src="img/staymate_logo-removebg-preview.png"
                 alt="StayMate Logo">

            <h1>Join Us!</h1>

            <p>
                Create your account and start
                exploring amazing destinations,
                hotels and travel experiences.
            </p>

        </div>


        <!-- Registration Section -->

        <div class="register-section">

            <h2>Create Account</h2>

            <p class="subtitle">
                Select your role to get started
            </p>

            <form id="register-form">

                <!-- Role Selection: Always Visible -->

                <div class="input-group">

                    <label for="role">Register As</label>

                    <div class="input-field">

                        <i class="fa-solid fa-circle-user"></i>

                        <select id="role" name="role" required>

                            <option value="" selected disabled>
                                Select your role
                            </option>

                            <option value="owner">
                                Property Owner
                            </option>

                            <option value="user">
                                User
                            </option>

                            <option value="admin">
                                Admin
                            </option>

                        </select>

                    </div>

                </div>


                <!-- Fields Will Be Added Here Using JavaScript -->

                <div id="dynamic-fields"></div>


                <!-- Register Button -->

                <button type="submit"
                        id="register-btn"
                        class="register-btn hidden">

                    Create Account

                </button>


                <!-- Login Link -->

                <div id="login-link" class="login-link hidden">

                    Already have an account?

                    <a href="index.html">Login</a>

                </div>

            </form>

        </div>

    </div>


    <script>

        // Get HTML elements

        const roleSelect = document.getElementById("role");
        const dynamicFields = document.getElementById("dynamic-fields");
        const registerButton = document.getElementById("register-btn");
        const loginLink = document.getElementById("login-link");
        const registerForm = document.getElementById("register-form");


        // Function to create an input field

        function createField(label, name, type, icon, placeholder) {

            return `
                <div class="input-group">

                    <label for="${name}">${label}</label>

                    <div class="input-field">

                        <i class="${icon}"></i>

                        <input
                            type="${type}"
                            id="${name}"
                            name="${name}"
                            placeholder="${placeholder}"
                            required
                        >

                    </div>

                </div>
            `;
        }


        // Display fields according to the selected role

        roleSelect.addEventListener("change", function () {

            const selectedRole = roleSelect.value;

            // Clear the previous fields

            dynamicFields.innerHTML = "";


            // Property Owner Registration

            if (selectedRole === "owner") {

                dynamicFields.innerHTML =

                    createField(
                        "Owner Name",
                        "ownerName",
                        "text",
                        "fa-solid fa-user",
                        "Enter owner name"
                    ) +

                    createField(
                        "Phone Number",
                        "phone",
                        "tel",
                        "fa-solid fa-phone",
                        "Enter your phone number"
                    ) +

                    createField(
                        "Address",
                        "address",
                        "text",
                        "fa-solid fa-location-dot",
                        "Enter your address"
                    ) +

                    createField(
                        "Email Address",
                        "email",
                        "email",
                        "fa-solid fa-envelope",
                        "Enter your email"
                    ) +

                    createField(
                        "Password",
                        "password",
                        "password",
                        "fa-solid fa-lock",
                        "Create a password"
                    ) +

                    createField(
                        "Confirm Password",
                        "confirmPassword",
                        "password",
                        "fa-solid fa-lock",
                        "Confirm your password"
                    );

            }


            // User Registration

            else if (selectedRole === "user") {

                dynamicFields.innerHTML =

                    createField(
                        "Full Name",
                        "fullName",
                        "text",
                        "fa-solid fa-user",
                        "Enter your full name"
                    ) +

                    createField(
                        "Email Address",
                        "email",
                        "email",
                        "fa-solid fa-envelope",
                        "Enter your email"
                    ) +

                    createField(
                        "Phone Number",
                        "phone",
                        "tel",
                        "fa-solid fa-phone",
                        "Enter your phone number"
                    ) +

                    createField(
                        "Password",
                        "password",
                        "password",
                        "fa-solid fa-lock",
                        "Create a password"
                    ) +

                    createField(
                        "Confirm Password",
                        "confirmPassword",
                        "password",
                        "fa-solid fa-lock",
                        "Confirm your password"
                    );

            }


            // Admin Registration

            else if (selectedRole === "admin") {

                dynamicFields.innerHTML =

                    createField(
                        "Full Name",
                        "fullName",
                        "text",
                        "fa-solid fa-user",
                        "Enter your full name"
                    ) +

                    createField(
                        "Email Address",
                        "email",
                        "email",
                        "fa-solid fa-envelope",
                        "Enter your email"
                    ) +

                    createField(
                        "Password",
                        "password",
                        "password",
                        "fa-solid fa-lock",
                        "Create a password"
                    ) +

                    createField(
                        "Confirm Password",
                        "confirmPassword",
                        "password",
                        "fa-solid fa-lock",
                        "Confirm your password"
                    );

            }


            // Show buttons after selecting a role

            registerButton.classList.remove("hidden");
            loginLink.classList.remove("hidden");

        });


        // Validate the form before submission

        registerForm.addEventListener("submit", function (event) {

            event.preventDefault();

            const password = document.getElementById("password").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;


            // Check whether passwords match

            if (password !== confirmPassword) {

                alert("Passwords do not match. Please try again.");

                document.getElementById("confirmPassword").focus();

                return;
            }


            // Demo message

            alert(
                "Registration form validated successfully!\n" +
                "Selected role: " +
                roleSelect.options[roleSelect.selectedIndex].text
            );

            // Connect your backend here to save the account.

        });

    </script>

</body>
</html>
